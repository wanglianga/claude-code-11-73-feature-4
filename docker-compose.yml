services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
      POSTGRES_DB: member_bitemp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d member_bitemp"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "15432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ccdev:ccdev@db:5432/member_bitemp
      AUTO_SEED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
